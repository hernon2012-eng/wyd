name: Multi-character contract

on:
  push:
    paths:
      - "codex-deliverables/arko-multichar-contract/**"
      - ".github/workflows/arko-multichar-contract.yml"
  pull_request:
    paths:
      - "codex-deliverables/arko-multichar-contract/**"
      - ".github/workflows/arko-multichar-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex-deliverables/arko-multichar-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: codex-deliverables/arko-multichar-contract/go.mod
          cache-dependency-path: codex-deliverables/arko-multichar-contract/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Validate examples against JSON Schema
        run: |
          python -m pip install -r tests/requirements.txt
          python tests/validate_examples.py
