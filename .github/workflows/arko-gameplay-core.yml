name: ARKO Gameplay Core

on:
  push:
    paths:
      - "codex-deliverables/arko-gameplay-core/**"
      - ".github/workflows/arko-gameplay-core.yml"
  pull_request:
    paths:
      - "codex-deliverables/arko-gameplay-core/**"
      - ".github/workflows/arko-gameplay-core.yml"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: codex-deliverables/arko-gameplay-core/go.mod
      - name: Check formatting
        working-directory: codex-deliverables/arko-gameplay-core
        run: test -z "$(gofmt -l .)"
      - name: Unit and transaction tests
        working-directory: codex-deliverables/arko-gameplay-core
        run: go test ./...
      - name: Race detector
        working-directory: codex-deliverables/arko-gameplay-core
        run: go test -race ./...
      - name: Static analysis
        working-directory: codex-deliverables/arko-gameplay-core
        run: go vet ./...
      - name: Build
        working-directory: codex-deliverables/arko-gameplay-core
        run: go build ./...
      - name: Fuzz smoke
        working-directory: codex-deliverables/arko-gameplay-core
        run: go test -run=^$ -fuzz=FuzzAddRemoveConservesQuantity -fuzztime=2s ./internal/core

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install -r codex-deliverables/arko-gameplay-core/tests/requirements.txt
      - name: Validate schemas and demonstration examples
        working-directory: codex-deliverables/arko-gameplay-core
        run: python tests/validate_contracts.py