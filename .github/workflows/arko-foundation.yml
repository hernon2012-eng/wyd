name: ARKO Foundation

on:
  push:
    paths:
      - "codex-deliverables/arko-foundation/**"
      - ".github/workflows/arko-foundation.yml"
  pull_request:
    paths:
      - "codex-deliverables/arko-foundation/**"
      - ".github/workflows/arko-foundation.yml"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: codex-deliverables/arko-foundation/gateway/go.mod
          cache-dependency-path: codex-deliverables/arko-foundation/gateway/go.mod
      - name: Check formatting
        working-directory: codex-deliverables/arko-foundation/gateway
        run: test -z "$(gofmt -l .)"
      - name: Test with race detector
        working-directory: codex-deliverables/arko-foundation/gateway
        run: go test -race ./...
      - name: Static analysis
        working-directory: codex-deliverables/arko-foundation/gateway
        run: go vet ./...

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install -r codex-deliverables/arko-foundation/tests/requirements.txt
      - name: Validate schemas and examples
        run: python codex-deliverables/arko-foundation/tests/validate_schemas.py