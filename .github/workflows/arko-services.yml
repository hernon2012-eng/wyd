name: ARKO Services Registry

on:
  push:
    paths:
      - "codex-deliverables/arko-services/**"
      - ".github/workflows/arko-services.yml"
  pull_request:
    paths:
      - "codex-deliverables/arko-services/**"
      - ".github/workflows/arko-services.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: codex-deliverables/arko-services/go.mod
      - name: Check formatting
        working-directory: codex-deliverables/arko-services
        run: test -z "$(gofmt -l .)"
      - name: Unit tests
        working-directory: codex-deliverables/arko-services
        run: go test ./...
      - name: Race detector
        working-directory: codex-deliverables/arko-services
        run: go test -race ./...
      - name: Static analysis
        working-directory: codex-deliverables/arko-services
        run: go vet ./...
      - name: Build
        working-directory: codex-deliverables/arko-services
        run: go build ./...

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install -r codex-deliverables/arko-services/tests/requirements.txt
      - name: Validate schema and demonstration example
        working-directory: codex-deliverables/arko-services
        run: python tests/validate_contracts.py
