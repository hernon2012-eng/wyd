name: ARKO Integration Readiness

on:
  push:
    branches:
      - codex/arko-integration-readiness-20261106
    paths:
      - 'codex-deliverables/INTEGRATION_READINESS/**'
      - '.github/workflows/arko-integration-readiness.yml'
  pull_request:
    paths:
      - 'codex-deliverables/INTEGRATION_READINESS/**'
      - '.github/workflows/arko-integration-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-manifest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test local asset manifest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ".\codex-deliverables\INTEGRATION_READINESS\tools\tests\Test-Generate-WYDAssetManifest.ps1"

  json-catalog-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing JSON Schema dependency
        run: python -m pip install -r codex-deliverables/arko-foundation/tests/requirements.txt
      - name: Test JSON catalog preflight
        working-directory: codex-deliverables/INTEGRATION_READINESS
        run: python -m unittest discover -s tools/tests -v
