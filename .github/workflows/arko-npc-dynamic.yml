name: ARKO NPC Dynamic

on:
  push:
    paths:
      - "codex-deliverables/arko-npc-dynamic/**"
      - ".github/workflows/arko-npc-dynamic.yml"
  pull_request:
    paths:
      - "codex-deliverables/arko-npc-dynamic/**"
      - ".github/workflows/arko-npc-dynamic.yml"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex-deliverables/arko-npc-dynamic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: codex-deliverables/arko-npc-dynamic/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build
        run: go build ./...

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex-deliverables/arko-npc-dynamic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install -r tests/requirements.txt
      - name: Validate schema and DEMONSTRAÇÃO examples
        run: python tests/validate_contracts.py
