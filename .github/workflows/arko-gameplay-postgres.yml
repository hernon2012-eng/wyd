name: ARKO Gameplay PostgreSQL

on:
  push:
    paths:
      - "codex-deliverables/arko-gameplay-core/**"
      - "CODEX_SESSION_HANDOFF.md"
      - ".github/workflows/arko-gameplay-postgres.yml"
  pull_request:
    paths:
      - "codex-deliverables/arko-gameplay-core/**"
      - "CODEX_SESSION_HANDOFF.md"
      - ".github/workflows/arko-gameplay-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: codex-deliverables/arko-gameplay-core/go.mod
      - name: Check formatting
        working-directory: codex-deliverables/arko-gameplay-core
        run: test -z "$(gofmt -l .)"
      - name: Unit tests
        working-directory: codex-deliverables/arko-gameplay-core
        run: go test ./...
      - name: Race detector
        working-directory: codex-deliverables/arko-gameplay-core
        run: go test -race ./...
      - name: Static analysis
        working-directory: codex-deliverables/arko-gameplay-core
        run: go vet ./...
      - name: Build
        working-directory: codex-deliverables/arko-gameplay-core
        run: go build ./...
      - name: Fuzz smoke
        working-directory: codex-deliverables/arko-gameplay-core
        run: go test -run=^$ -fuzz=FuzzAddRemoveConservesQuantity -fuzztime=2s ./internal/core

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install -r codex-deliverables/arko-gameplay-core/tests/requirements.txt
      - name: Validate schemas and demonstration examples
        working-directory: codex-deliverables/arko-gameplay-core
        run: python tests/validate_contracts.py

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arko_test
          POSTGRES_USER: arko_test
          POSTGRES_PASSWORD: arko_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U arko_test -d arko_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: codex-deliverables/arko-gameplay-core/go.mod
      - name: Run full suite against isolated PostgreSQL service
        working-directory: codex-deliverables/arko-gameplay-core
        env:
          ARKO_POSTGRES_TEST_DSN: postgres://arko_test:arko_test@127.0.0.1:55432/arko_test?sslmode=disable
        run: |
          go test ./... -count=1
          go test -race ./... -count=1
